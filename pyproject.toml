[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-monetary-policy-india"
version = "0.1.0"
description = "Research prototype for Indian inflation forecasting and policy scenario analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.2,<3",
    "openai>=1.40,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "psutil>=6,<8",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<7",
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    # Security dependencies
    "argon2-cffi>=23.1,<24",
    "PyJWT>=2.15,<3",
    "pyotp>=2.9,<3",
    "qrcode>=7.4,<8",
    "slowapi>=0.1,<1",
    "cryptography>=50.0.2,<51",
    "filelock>=4.2.1,<5",
]

[project.optional-dependencies]
econometrics = [
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
    "joblib>=1.4,<2",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx2>=2.16,<3",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "safety>=3.0,<4",
]
evidence-local = ["sentence-transformers>=3,<6"]
local-storage = [
    "pyarrow>=17,<25",
    "chromadb>=0.5,<2",
]
security = [
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "safety>=3.0,<4",
    "detect-secrets>=1.5,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.models" = [
    "Final_data_and_models/Final_model_sets/India_CPI_Model_Package/*",
    "Final_data_and_models/Final_model_sets/India_CPI_Model_Package/**/*",
    "p2_cpi_benchmark_assets/*",
    "p2_cpi_benchmark_assets/source/*",
    "p2_cpi_benchmark_assets/artifacts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"
